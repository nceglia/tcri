name: Tracking issue
description: An outcome delivered through sub-issues
title: "Tracking: "
labels: [tracking]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true for users when this is done.
    validations:
      required: true
  - type: textarea
    id: sub-issues
    attributes:
      label: Sub-issues
      description: One reviewable outcome each, delivered by one pull request or a stack. Attach each as a sub-issue.
    validations:
      required: true
  - type: textarea
    id: footprint
    attributes:
      label: Footprint
      description: Files, modules, public symbols and stored results this work touches.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
