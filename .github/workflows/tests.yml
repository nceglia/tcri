name: tests

on:
  # Every pull request, not just those targeting main. Restricting to `branches: [main]`
  # meant a STACKED pr — one based on another branch — got no checks at all, so every PR in
  # a stack but the first would merge unverified and only be tested once its base had
  # already landed. That is exactly backwards: the whole point of a stack is that each
  # piece is reviewable and verifiable on its own.
  pull_request:
  # On push as well, so main and the release branches are known-good at the commit a release
  # is cut from, not only at the tip of the branch a PR was merged from.
  push:
    branches: [main, "[0-9]+.[0-9]+.x"]
  # Twice a month, to catch a dependency release breaking tcri between pull requests.
  schedule:
    - cron: "0 5 1,15 * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Python and the newest, plus that newest against pre-release
          # dependencies: an upstream release that breaks tcri shows up here first, and the job
          # is allowed to fail so it warns without blocking.
          - python: "3.12"
            deps: stable
          - python: "3.14"
            deps: stable
          - python: "3.14"
            deps: pre
    name: test (${{ matrix.python }}, ${{ matrix.deps }})
    continue-on-error: ${{ matrix.deps == 'pre' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version comes from git tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" ${{ matrix.deps == 'pre' && '--pre' || '' }}
      - name: Run tests
        run: pytest tests/ -v --runslow

  build:
    # The artifact a release uploads, built and checked on every change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version comes from git tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build "twine>=7"
          python -m build
      - name: Check distributions
        run: python -m twine check dist/*

  docs:
    # Builds the docs the way Read the Docs does and FAILS ON WARNING.
    #
    # Without this, a broken autodoc target only warns: the build still exits 0, and RTD
    # publishes a page with the heading present and nothing under it. That is not
    # hypothetical — moving tcri/tools/_compare.py left `.. automodule:: tcri.tools._compare`
    # in docs/api/metrics.md, and the rendered "Group comparison" section silently went from
    # 4303 characters to 140 while the full test suite stayed green. No pytest run can see
    # this class of defect; only a docs build can.
    #
    # The setup deliberately MIRRORS .readthedocs.yaml — python 3.12, docs/requirements.txt,
    # tcri installed with --no-deps (only for its version, which comes from git tags), heavy
    # deps mocked via autodoc_mock_imports in conf.py. A job that installed the real
    # dependencies would pass in environments where RTD fails, which is worse than no job at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version comes from git tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install docs toolchain (mirrors .readthedocs.yaml)
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install --no-deps .
      - name: Build docs, failing on warning
        run: sphinx-build -b html docs _build/html -W --keep-going
