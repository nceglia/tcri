[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tcri"
dynamic = ["version"]
description = "Information theoretic metrics for single cell RNA and TCR sequencing."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Nicholas Ceglia", email = "nickceglia@gmail.com" },
]
keywords = [
    "single-cell",
    "TCR",
    "scRNA-seq",
    "immunology",
    "information-theory",
    "bayesian",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.26.1",
    "pandas>=2.2.2",
    "scipy>=1.14.1",
    "scikit-learn>=1.1",
    "anndata>=0.11.3",
    "scanpy>=1.9.5",
    "torch>=2.4.1",
    "pyro-ppl>=1.9.1",
    "scvi-tools>=1.3.0",
    "umap-learn>=0.5.6",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "tqdm>=4.66.5",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-cov",
]
# Building examples/example.ipynb with its outputs embedded. Not needed to use tcri.
notebook = [
    "jupytext>=1.16",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6",
]
# Assembling release notes from docs/release-notes/ at release time. Not needed to use tcri.
dev = [
    "towncrier>=24",
]

[project.urls]
Homepage = "https://github.com/nceglia/tcri"
Repository = "https://github.com/nceglia/tcri"
Issues = "https://github.com/nceglia/tcri/issues"
Documentation = "https://tcri.readthedocs.io"

# The version comes from the latest git tag (vX.Y.Z); no file holds it. On main, commits after a
# tag build as the next minor .devN; on an X.Y.x branch, as the next patch .devN.
[tool.hatch.version]
source = "vcs"
raw-options.version_scheme = "release-branch-semver"

[tool.hatch.build.targets.wheel]
packages = ["tcri"]

# Anchored paths: unanchored names would match at any depth.
[tool.hatch.build.targets.sdist]
include = ["/tcri", "/tests", "/governance", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = ["/tests/data/archives"]

[tool.towncrier]
name = "tcri"
directory = "docs/release-notes"
filename = "docs/release-notes/{version}.md"
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/nceglia/tcri/pull/{issue})"
single_file = false
fragment.breaking.name = "Breaking changes"
fragment.feat.name = "Features"
fragment.fix.name = "Bug fixes"
fragment.perf.name = "Performance"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
