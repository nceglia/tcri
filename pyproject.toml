[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcri"
version = "0.1.0"
description = "Information theoretic metrics for single cell RNA and TCR sequencing."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Nicholas Ceglia", email = "nickceglia@gmail.com" },
]
keywords = [
    "single-cell",
    "TCR",
    "scRNA-seq",
    "immunology",
    "information-theory",
    "bayesian",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.26.1",
    "pandas>=2.2.2",
    "scipy>=1.14.1",
    "scikit-learn>=1.1",
    "anndata>=0.11.3",
    "scanpy>=1.9.5",
    "torch>=2.4.1",
    "pyro-ppl>=1.9.1",
    "scvi-tools>=1.3.0",
    "umap-learn>=0.5.6",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "mpltern>=1.0.4",
    "gseapy>=1.1.4",
    "daft",
    "tqdm>=4.66.5",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/nceglia/tcri"
Repository = "https://github.com/nceglia/tcri"
Issues = "https://github.com/nceglia/tcri/issues"
Documentation = "https://tcri.readthedocs.io"

[tool.setuptools.packages.find]
include = ["tcri*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
