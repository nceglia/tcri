# .readthedocs.yaml — Read the Docs build configuration
#
# The heavy runtime dependencies (torch, scvi-tools, scanpy, pyro, ...) are NOT
# installed here. They are mocked at build time via ``autodoc_mock_imports`` in
# docs/conf.py, so the API reference builds from source without pulling the full
# ML stack — which keeps the RTD build fast and avoids out-of-memory failures.
# tcri itself is installed with --no-deps, only so its version (from git tags) is known.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # RTD clones shallow; the version comes from the nearest tag, so fetch history and tags.
    post_checkout:
      - git fetch --unshallow || true
      - git fetch --tags --force
    post_install:
      - python -m pip install --no-deps .
      # A missing tag makes the version fall back to 0.1.devN silently; fail instead.
      - python -c "import importlib.metadata as m, sys; v = m.version('tcri'); print('tcri', v); sys.exit(v.startswith(('0.0', '0.1.dev')))"

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  # Agree with the `docs` job in .github/workflows/tests.yml. Without this, CI fails on a
  # warning that RTD would happily publish, so the two builds would disagree about whether
  # the docs are broken — and the published site is the one users read.
  fail_on_warning: true
